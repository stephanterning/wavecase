name: Test and publish image

on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: wavecase
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: wavecase_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U wavecase -d wavecase_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build application image
        run: docker build --tag wavecase-check .
      - name: Run checks with an isolated database
        run: |
          docker run --rm --network host \
            -e DATABASE_URL=postgres://wavecase:ci-only-password@127.0.0.1:5432/wavecase_test \
            -e APP_URL=http://localhost:3000 \
            wavecase-check sh -ec 'npm run lint; npm run typecheck; npm run db:migrate; npm test'

  publish:
    needs: test
    concurrency:
      group: publish-image-${{ github.sha }}
      cancel-in-progress: false
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image name and preserve existing builds
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          tag="sha-${GITHUB_SHA}"
          digest=$(sh scripts/image-digest.sh "$image:$tag")
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "existing=$digest" >> "$GITHUB_OUTPUT"
      - name: Build and publish both architectures
        if: steps.image.outputs.existing == ''
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record published image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          TAG: ${{ steps.image.outputs.tag }}
        run: |
          digest=$(sh scripts/image-digest.sh "$IMAGE:$TAG")
          test -n "$digest"
          printf 'Image: `%s:%s`\n\nPinned reference: `%s@%s`\n' \
            "$IMAGE" "$TAG" "$IMAGE" "$digest" >> "$GITHUB_STEP_SUMMARY"
