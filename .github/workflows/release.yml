name: Publish release image

on:
  release:
    # published includes new pre-releases and stable releases; released also
    # covers promoting an existing pre-release to stable. Re-runs are harmless.
    types: [published, released]

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the existing image without rebuilding
        env:
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          # Restrict release names to version-shaped, Docker-compatible tags.
          if ! [[ "$VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9][A-Za-z0-9.-]*)?$ ]] || [ "${#VERSION}" -gt 128 ]; then
            echo 'Use a version such as v0.1.0 or v0.1.0-rc.1.' >&2
            exit 1
          fi
          image="ghcr.io/${REPOSITORY,,}"
          revision=$(git rev-parse HEAD)
          digest=$(sh scripts/image-digest.sh "$image:sha-$revision")
          if [ -z "$digest" ]; then
            echo 'No published image for this commit. Wait for its branch CI build, then re-run this job.' >&2
            exit 1
          fi
          existing=$(sh scripts/image-digest.sh "$image:$VERSION")
          if [ -n "$existing" ] && [ "$existing" != "$digest" ]; then
            echo 'This release tag already points to a different image. Publish a new version.' >&2
            exit 1
          fi
          if [ -z "$existing" ]; then
            docker buildx imagetools create --tag "$image:$VERSION" "$image@$digest"
          fi
          actual=$(sh scripts/image-digest.sh "$image:$VERSION")
          test "$actual" = "$digest"
          printf 'Release: `%s`\n\nCommit: `%s`\n\nImage: `%s:%s`\n\nPinned reference: `%s@%s`\n' \
            "$VERSION" "$revision" "$image" "$VERSION" "$image" "$digest" >> "$GITHUB_STEP_SUMMARY"
